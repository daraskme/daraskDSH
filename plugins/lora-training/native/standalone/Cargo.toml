[package]
name = "dsh-anima"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }
libloading = "0.8"
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
