- insert:
    - id: darask-task-router
      name: ../plugins/task-router/index.mjs
    - id: dsh-anima-lora-trainer
      name: ../plugins/dsh-anima-lora-trainer/index.mjs
    - id: dsh-manga-studio
      name: ../plugins/dsh-manga-studio/index.mjs
    - id: darask-cli-models
      name: ../agents/index.mjs
- id: agent-default-model
  config:
    provider: !!js "process.env.DARASK_DSH_MODEL === 'openai' ? 'openai' : 'local-cli'"
    model: !!js "process.env.DARASK_DSH_MODEL === 'openai' ? process.env.DARASK_OPT_MODEL : process.env.DARASK_DSH_MODEL || 'codex'"
    reasoningEffort: !!js "process.env.DARASK_DSH_MODEL === 'openai' ? process.env.DARASK_OPT_EFFORT || undefined : undefined"
- id: subagent
  config:
    maxDepth: 4
    maxActiveSubagents: 128
- id: compaction-basic
  config:
    # Local CLI envelope: 131072 tokens. A slightly later trigger: 49152 tokens.
    # Leave a gap after the summary + recent tail to avoid compacting every step.
    auto: true
    thresholdRatio: 0.375
    headroomTokens: 65536
    retainTokens: 8192
    maxTokens: 8192
- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      - {provider: local-cli, model: auto}
      - {provider: local-cli, model: google}
      - {provider: local-cli, model: devin-free}
      - {provider: local-cli, model: devin}
      - {provider: local-cli, model: muse}
      - {provider: local-cli, model: grok}
      - {provider: local-cli, model: cursor}
      - {provider: local-cli, model: codex}
      - {provider: local-cli, model: claude}
- id: session-reference
  config:
    maxReferenceBytes: 8192
- id: web
  config: {searchProvider: ddgs, fetchProvider: http}
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- insert:
    - id: darask-search
      name: ../search/index.mjs
- id: llm-pi-ai
  config:
    providers:
      openai:
        displayName: OpenAI API
        apiKeyEnv: OPENAI_API_KEY
        # models replaces the installed catalog wholesale: keep every installed id,
        # then add models the API serves but pi-ai does not list yet.
        models:
          - {id: chat-latest}
          - {id: gpt-4}
          - {id: gpt-4-turbo}
          - {id: gpt-4.1}
          - {id: gpt-4.1-mini}
          - {id: gpt-4.1-nano}
          - {id: gpt-4o}
          - {id: gpt-4o-2024-05-13}
          - {id: gpt-4o-2024-08-06}
          - {id: gpt-4o-2024-11-20}
          - {id: gpt-4o-mini}
          - {id: gpt-5}
          - {id: gpt-5-chat-latest}
          - {id: gpt-5-mini}
          - {id: gpt-5-nano}
          - {id: gpt-5-pro}
          - {id: gpt-5.1}
          - {id: gpt-5.2}
          - {id: gpt-5.2-pro}
          - {id: gpt-5.3-codex}
          - {id: gpt-5.3-codex-spark}
          - {id: gpt-5.4}
          - {id: gpt-5.4-mini}
          - {id: gpt-5.4-nano}
          - {id: gpt-5.4-pro}
          - {id: gpt-5.5}
          - {id: gpt-5.5-pro}
          - {id: gpt-5.6-cyber}
          - {id: gpt-5.6-luna}
          - {id: gpt-5.6-sol}
          - {id: gpt-5.6-terra}
          - {id: gpt-6-astra}
          - {id: gpt-6-luna}
          - {id: gpt-6-sol}
          - {id: gpt-6.1-sol}
          - {id: gpt-6.1-terra}
          - {id: gpt-daybreak-blue-latest}
          - {id: gpt-daybreak-red-latest}
          - {id: o1}
          - {id: o1-pro}
          - {id: o3}
          - {id: o3-mini}
          - {id: o3-pro}
          - {id: o4-mini}
          - id: gpt-6.2-astra
            name: GPT-6.2 Astra
            contextWindow: 272000
            input: [text, image]
            reasoningEfforts: {low: low, medium: medium, high: high, xhigh: xhigh, max: max}
          - id: gpt-6.2-sol
            name: GPT-6.2 Sol
            contextWindow: 272000
            input: [text, image]
            reasoningEfforts: {low: low, medium: medium, high: high, xhigh: xhigh, max: max}
